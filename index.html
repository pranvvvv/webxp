
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dev-server-only fallback (vite dev doesn't run scripts/prerender.mjs). In production
         builds these are stripped and replaced per-route by scripts/prerender.mjs, which bakes
         each route's real title/description/canonical/OG/JSON-LD from src/lib/seo-data.mjs
         directly into dist/<route>/index.html. -->
    <title>GetPixage - Premium Web Design Agency | AI Automation | SaaS Development | UK</title>
    <meta name="description" content="GetPixage is a premium UK web design agency specializing in high-performance websites, AI automation, and SaaS development. Get a free consultation: +44 7415 960499." />
    <meta name="author" content="GetPixage" />
    <meta name="language" content="English" />

    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#1a365d" />
    <meta name="msapplication-TileColor" content="#1a365d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Consent Mode — must run before any Google tag. Defaults to
         "denied" for ad/analytics storage until the cookie banner (see
         src/components/legal/CookieConsentBanner.tsx) records a choice, per
         Google's Consent Mode v2 requirements for AdSense in the UK/EEA. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      });
      window.gtag = gtag;
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4152356032584855"
     crossorigin="anonymous"></script>
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
